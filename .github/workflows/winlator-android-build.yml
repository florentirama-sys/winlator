name: Winlator debug APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: {repository: brunodev85/winlator, ref: fb66541b93a4eb3ee585a433b4c7b20544d58e40, submodules: recursive}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {accept-android-sdk-licenses: false, packages: ''}
      - name: Accept licenses and install SDK 34, NDK 24, CMake 3.22.1, adb
        shell: bash
        run: |
          set +o pipefail; yes | sdkmanager --licenses >/dev/null; set -o pipefail
          sdkmanager --install 'platform-tools' 'platforms;android-34' 'ndk;24.0.8215888' 'cmake;3.22.1'
      - name: Build debug APK (temporary JNI duplicate pickFirst)
        shell: bash
        run: |
          printf '%s\n' "allprojects { afterEvaluate { if (plugins.hasPlugin('com.android.application')) android.packagingOptions.jniLibs.pickFirsts += '**/*.so' } }" > "$RUNNER_TEMP/packaging.gradle"
          cd app && bash gradlew -I "$RUNNER_TEMP/packaging.gradle" --no-daemon clean assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: winlator-debug-apk, path: app/app/build/outputs/apk/debug/*.apk, if-no-files-found: error}
